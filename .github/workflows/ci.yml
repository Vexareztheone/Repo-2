name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet Restore
      
      - name: Build the app
        run: dotnet build --no-restore

      - name: Run tests
        run: dotnet test --no-build verbosity normal